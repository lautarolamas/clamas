<!doctype html>
<html lang="es-AR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Página no encontrada</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/png" href="/img/favicon.png">
  <link rel="stylesheet" href="/css/site.css">
  <style>
    .nf { min-height: 100svh; display: grid; place-items: center; text-align: center; padding: 24px; }
    .nf img { width: 140px; margin: 0 auto 28px; border-radius: 50%; }
    .nf h1 { font-family: var(--display); font-size: clamp(30px, 6vw, 44px); margin-bottom: 14px; }
    .nf p { color: var(--muted); margin-bottom: 28px; }
  </style>
</head>
<body>
  <main class="nf">
    <div>
      <img src="/img/logo-192.png" alt="Logo">
      <h1>Esta página <span class="gold">no existe</span></h1>
      <p>Puede que el link esté mal escrito o que ya no esté disponible.</p>
      <a class="btn btn-gold" href="/">Volver al inicio</a>
    </div>
  </main>
</body>
</html>
